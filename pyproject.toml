[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smabafiba"
version = "0.1.0"
description = "Smart batch file backups with rclone and 7-Zip"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Leandro Santos"}]
dependencies = []

[project.scripts]
smabafiba = "smabafiba.cli:main"

[tool.setuptools.packages.find]
include = ["smabafiba*"]
