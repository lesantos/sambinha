[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sambinha"
version = "0.3.0"
description = "Backups locais e S3 com cópias simples ou lotes compactados"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Leandro Santos"}]
dependencies = ["python-dotenv>=1.0,<2"]

[project.scripts]
sambinha = "sambinha.cli:main"

[tool.setuptools.packages.find]
include = ["sambinha*"]
