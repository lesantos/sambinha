# Português do Brasil. English: sambinha.example.toml
# Links da origem são ignorados; links conflitantes no destino são substituídos sem alterar os alvos.
# Caminhos são relativos a ESTE arquivo; ~ e variáveis de ambiente funcionam.
[backup]
# Pasta com o estado de cada job (state.json, diário de envios, caches), uma subpasta por job.
state_dir = "./state"

# Pasta dos logs de execução em JSON-lines (um arquivo por invocação); os antigos são removidos conforme
# log_retention_days.
log_dir = "./logs"

# Cópias locais do JSON de controle de cada lote, ao lado de state e logs. O verify-local-metadata as lê, e
# elas permitem adotar lotes já guardados quando o estado se perde.
metadata_dir = "./metadata"

# Pasta opcional para arquivos temporários (arquivos em construção, descoberta); precisa existir e ser
# gravável. Sem ela, vale a pasta temporária do sistema (TMPDIR).
# temp_dir = "/mnt/ssd/sambinha-tmp"

# Executável do rclone: um nome encontrado no PATH ou um caminho completo.
rclone = "rclone"

# Arquivo de configuração do rclone que define os remotos (como aws). Vazio usa
# ~/.config/rclone/rclone.conf.
rclone_config = "./rclone.example.conf"

# Limite de tempo, em segundos, de cada chamada externa ao rclone e de cada listagem de diretório da origem
# na descoberta dos jobs batch. Árvores grandes em compartilhamentos lentos pedem um valor alto.
timeout = 3600

# Arquivo dotenv privado opcional; ~ e variáveis herdadas funcionam no caminho.
# Caminhos relativos partem da pasta deste TOML, independentemente da pasta de execução.
# secrets_file = "~/.config/sambinha/secrets.env"

# Variáveis já exportadas no terminal têm prioridade sobre as do arquivo.
# O arquivo é lido como dados, sem execução; ausente/inválido interrompe o programa.
# Defina CRONITOR_URL no arquivo/ambiente; nunca versione a URL com credenciais.
# Sem esta linha, CRONITOR_URL também é lida automaticamente.
# cronitor_url = "${CRONITOR_URL}"

# A mesma origem pode ter tarefas/destinos/estratégias independentes.
[[jobs]]
# Nome do job (letras, números, _ e -). Dá nome às pastas de estado e metadados do job e é o que --job
# seleciona.
name = "documents-local"

# Jobs batch: dias em que os arquivos de lote antigos de arquivos que sumiram da origem são mantidos antes
# da remoção definitiva. O prazo vale por lote, não por arquivo: um lote com um arquivo apagado e outro
# alterado guarda o maior entre deleted_days e version_days. Jobs simples usam o maior dos dois para tudo.
deleted_days = 10

# Jobs batch: dias em que os lotes antigos de arquivos que mudaram são mantidos antes da remoção definitiva,
# e portanto por quanto tempo as versões anteriores continuam recuperáveis. Com 0 elas expiram de imediato,
# na próxima limpeza. Jobs simples usam o maior entre version_days e deleted_days para tudo.
version_days = 2

# Mantém os logs escritos nos últimos N dias; logs inativos mais antigos do Sambinha são removidos em
# execuções reais. 0 desativa a limpeza.
log_retention_days = 14

# O que o arquivo de log registra: error (só erros), summary (erros, alertas, resumos por job e o resultado
# final) ou detailed (também eventos por arquivo). Não muda a verbosidade do próprio rclone.
log_file_level = "summary"

# O que é impresso no terminal, com os mesmos níveis de log_file_level (error, summary ou detailed).
# Independe do nível do arquivo.
log_terminal_level = "summary"

# Alerta leve no Cronitor quando mais de tantas remoções permanentes estão por acontecer. Não interrompe o
# backup nem muda prazos.
deletion_alert_threshold = 1000

# Depois de um backup, executa a verificação local da origem (tamanho e data contra os JSONs de controle
# locais, sem ler o S3) se passaram tantos dias desde a última. 0 desativa. A mesma verificação e as demais
# podem ser feitas à mão: sambinha verify-local-metadata --job NOME (informa needs_update),
# verify-destination-metadata (compara as réplicas dos JSONs) e verify-destination-integrity (teste de
# integridade dos arquivos pelo 7-Zip).
verify_interval_days = 0

# Como os arquivos são comparados: "simple" usa tamanho e data de modificação em nanossegundos, sem ler o
# conteúdo; "hash" também calcula SHA-256/MD5 nos inventários dos jobs batch. A verificação local diária
# sempre compara só tamanho e data.
verification_mode = "simple"

# Transferências simultâneas dentro do rclone nos jobs simples.
transfer_workers = 4

# true apenas informa o que seria feito e não altera nada.
dry_run = false

# Pasta de origem do backup.
source = "~/Documents"

# Para onde vai o backup: uma pasta local ou um remoto rclone com bucket, como aws:BUCKET/prefixo. Dê a cada
# job um prefixo exclusivo.
destination = "~/Backups/documents-simple"

# Tipo do destino: "local" (pasta ou disco montado) ou "s3".
type = "local"

# "simple": um rclone sync que guarda arquivos substituídos e apagados em uma pasta de histórico. "batch":
# agrupa arquivos em lotes 7-Zip com índice de recuperação e controles.
logic = "simple"

# Confere a capacidade livre do disco de origem antes de executar. Use false em origens que informam
# capacidade zero (como Seafile/FUSE). Só essa checagem de capacidade é pulada; as de armazenamento
# temporário e de montagem/caminho continuam.
check_source_disk = true

# Confere a capacidade livre de um destino local (também vale para a pasta de restauração). O S3 não tem
# disco de destino local.
check_destination_disk = true

# Quando este job falha: true continua com os próximos jobs; false interrompe a invocação.
continue_on_job_error = true

# Classe de armazenamento S3 dos arquivos de lote.
# Configuração S3; não afeta destinos locais.
# storage_class = "GLACIER_IR"

# Jobs simples em S3 (ignorado em destinos locais): passa --fast-list ao rclone, com menos requisições de
# listagem e memória proporcional ao número de objetos.
# fast_list = true

# S3: --s3-chunk-size dos envios (por exemplo 64M), útil para arquivos de vários GB. Ignorado em destinos
# locais.
# s3_chunk_size = "64M"

# S3: --s3-upload-concurrency, partes enviadas em paralelo (1-64). Ignorado em destinos locais.
# s3_upload_concurrency = 8

# Arquivo com padrões nativos de exclusão do rclone, relativo a este TOML. É lido quando o job começa, e um
# arquivo ausente ou ilegível interrompe o job.
exclude_files = "./excludes.example.txt"

# Ponto de montagem esperado da origem: o volume precisa estar montado e não vazio, senão o job é
# interrompido.
# source_mount = "/mnt/dados"

# Ponto de montagem esperado de um destino local, conferido da mesma forma. Deixe vazio ou omita para S3.
# destination_mount = "/mnt/backup"

# Jobs simples: limite absoluto de remoções por execução (rclone --max-delete); versões antigas vão para a
# pasta de histórico. Não tem efeito em jobs batch, que usam max_delete_percent.
max_delete = 100

[[jobs]]
# Nome do job (letras, números, _ e -). Dá nome às pastas de estado e metadados do job e é o que --job
# seleciona.
name = "documents-s3"

# Quantas gerações do índice de recuperação (o arquivo a partir do qual o estado pode ser reconstruído)
# ficam no destino; as mais antigas são removidas.
recovery_index_versions = 3

# Jobs batch: dias em que os arquivos de lote antigos de arquivos que sumiram da origem são mantidos antes
# da remoção definitiva. O prazo vale por lote, não por arquivo: um lote com um arquivo apagado e outro
# alterado guarda o maior entre deleted_days e version_days. Jobs simples usam o maior dos dois para tudo.
deleted_days = 10

# Jobs batch: dias em que os lotes antigos de arquivos que mudaram são mantidos antes da remoção definitiva,
# e portanto por quanto tempo as versões anteriores continuam recuperáveis. Com 0 elas expiram de imediato,
# na próxima limpeza. Jobs simples usam o maior entre version_days e deleted_days para tudo.
version_days = 2

# Mantém os logs escritos nos últimos N dias; logs inativos mais antigos do Sambinha são removidos em
# execuções reais. 0 desativa a limpeza.
log_retention_days = 14

# O que o arquivo de log registra: error (só erros), summary (erros, alertas, resumos por job e o resultado
# final) ou detailed (também eventos por arquivo). Não muda a verbosidade do próprio rclone.
log_file_level = "summary"

# O que é impresso no terminal, com os mesmos níveis de log_file_level (error, summary ou detailed).
# Independe do nível do arquivo.
log_terminal_level = "summary"

# Alerta leve no Cronitor quando mais de tantas remoções permanentes estão por acontecer. Não interrompe o
# backup nem muda prazos.
deletion_alert_threshold = 1000

# Depois de um backup, executa a verificação local da origem (tamanho e data contra os JSONs de controle
# locais, sem ler o S3) se passaram tantos dias desde a última. 0 desativa. A mesma verificação e as demais
# podem ser feitas à mão: sambinha verify-local-metadata --job NOME (informa needs_update),
# verify-destination-metadata (compara as réplicas dos JSONs) e verify-destination-integrity (teste de
# integridade dos arquivos pelo 7-Zip).
verify_interval_days = 0

# Como os arquivos são comparados: "simple" usa tamanho e data de modificação em nanossegundos, sem ler o
# conteúdo; "hash" também calcula SHA-256/MD5 nos inventários dos jobs batch. A verificação local diária
# sempre compara só tamanho e data.
verification_mode = "simple"

# Só com verification_mode = "hash" (ignorada em "simple", o padrão, que nunca calcula hashes): reaproveita
# os hashes de um arquivo quando dispositivo, inode, tamanho, mtime, ctime e modo estão inalterados,
# evitando ler a origem inteira. Só jobs batch.
fingerprint_cache = true

# Jobs batch: true confere se os arquivos da origem ficam estáveis durante a leitura e a compactação,
# retentando até 3 vezes e falhando se continuarem mudando; false pula essas checagens e deixa as mudanças
# para o próximo backup.
verify_source_changes = true

# Jobs batch: true monta o inventário com o tamanho e a data da listagem do rclone, sem um stat por arquivo
# (mais rápido em compartilhamentos de rede). Exige logic = "batch", verification_mode = "simple",
# verify_source_changes = false e exclude_files. Os arquivos são registrados com modo 0o755.
inventory_from_listing = false

# Só na restauração: bits de permissão (por exemplo 0o644) aplicados aos arquivos restaurados. Sem ele, vale
# o modo registrado.
# file_mode = 0o644

# Só com verification_mode = "hash" e fingerprint_cache = true: força uma releitura completa de todos os
# arquivos após tantos dias, mesmo com o cache parecendo válido, para pegar mudanças que os metadados do
# arquivo não revelaram. No modo "simple" nenhum conteúdo é lido, então ela não tem efeito útil: só renova
# um carimbo de data no estado, o que causa uma publicação extra ocasional do índice.
fingerprint_full_scan_days = 7

# Lotes preparados, compactados e enviados ao mesmo tempo, cada um com sua área de preparo. Mais workers
# usam mais espaço temporário, CPU e memória.
batch_workers = 2

# true apenas informa o que seria feito e não altera nada.
dry_run = false

# "auto" retoma uma execução batch interrompida a partir dos diários e caches; "fresh" os descarta a cada
# execução.
resume = "auto"

# Pasta de origem do backup.
source = "~/Documents"

# Para onde vai o backup: uma pasta local ou um remoto rclone com bucket, como aws:BUCKET/prefixo. Dê a cada
# job um prefixo exclusivo.
# aws é o remote de rclone.example.conf; crie o bucket primeiro.
# Prefira prefixos separados: jobs sobrepostos podem substituir dados/controles.
# O nome do bucket deve ser globalmente único.
destination = "aws:YOUR-BUCKET/documents-batches"

# Tipo do destino: "local" (pasta ou disco montado) ou "s3".
type = "s3"

# "simple": um rclone sync que guarda arquivos substituídos e apagados em uma pasta de histórico. "batch":
# agrupa arquivos em lotes 7-Zip com índice de recuperação e controles.
logic = "batch"

# Nível do 7-Zip (0-9, 0 = armazenar) para arquivos de texto.
# Três faixas de compressão dentro de cada arquivo de lote, escolhidas pela ÚLTIMA extensão do arquivo
# (sem distinguir maiúsculas; "a.tar.gz" -> "gz"; ".bashrc" e "Makefile" não têm extensão). Níveis do 7-Zip 0-9
# (0 = armazenar). O texto vai primeiro (mais barato), depois "outros", depois os já compactados, armazenados.
compression_text_level = 1

# Nível do 7-Zip (0-9, 0 = armazenar) para toda extensão que não está em nenhuma lista.
compression_other_level = 1

# Nível do 7-Zip (0-9, 0 = armazenar) para arquivos já compactados (imagens, vídeo, pacotes...).
compression_compressed_level = 0

# Threads usadas por cada comando do compactador (1-64).
compression_threads = 2

# Extensões compactadas no compression_text_level.
# As entradas são extensões simples (sem ponto nem espaços; maiúsculas e ponto inicial são ignorados). Uma extensão
# não pode se repetir nem estar nas duas listas. A palavra-chave "<none>" representa arquivos SEM extensão; use-a
# em no máximo uma lista (texto, por padrão); em nenhuma, esses arquivos caem na faixa "outros". Edite à vontade:
compression_text_extensions = [
    "<none>", "txt", "text", "md", "markdown", "rst", "adoc", "asciidoc", "org",
    "tex", "latex", "bib", "log", "out", "err", "csv", "tsv", "psv",
    "json", "jsonl", "ndjson", "geojson", "xml", "xsd", "xsl", "xslt", "dtd",
    "plist", "yaml", "yml", "toml", "ini", "cfg", "conf", "config", "properties",
    "env", "lock", "gradle", "cmake", "mk", "html", "htm", "xhtml", "css",
    "scss", "sass", "less", "js", "mjs", "cjs", "jsx", "ts", "tsx",
    "vue", "svelte", "php", "py", "pyi", "pyw", "rb", "erb", "pl",
    "pm", "tcl", "lua", "r", "jl", "sh", "bash", "zsh", "fish",
    "ps1", "psm1", "psd1", "bat", "cmd", "awk", "sed", "c", "h",
    "cc", "cpp", "cxx", "hpp", "hh", "hxx", "cs", "java", "kt",
    "kts", "scala", "groovy", "swift", "m", "mm", "go", "rs", "zig",
    "nim", "dart", "ex", "exs", "erl", "hrl", "hs", "ml", "mli",
    "fs", "fsx", "clj", "cljs", "lisp", "el", "scm", "sql", "ddl",
    "graphql", "gql", "proto", "thrift", "tf", "tfvars", "hcl", "nix", "vcf",
    "ics", "srt", "vtt", "ass", "svg", "rtf", "diff", "patch", "eml",
    "mbox", "ldif", "po", "pot", "qss", "ui", "qml", "asm", "s",
    "v", "vhd", "vhdl", "sv", "ipynb", "sln", "csproj", "vbproj", "xaml",
    "resx", "tmpl", "tpl", "j2", "jinja", "hbs", "mustache", "ejs", "pug",
    "haml", "reg", "inf", "service", "timer", "desktop", "rules", "cnf", "gitignore",
    "gitattributes", "editorconfig", "dockerignore", "mod", "sum", "cabal", "gemspec", "podspec", "rake",
    "bzl", "bazel", "ninja", "sbt", "pro", "pri", "wsdl", "rss", "atom",
    "opml", "kml", "gpx", "tei", "bas", "vb", "vbs", "pas", "pp",
    "dpr", "f", "f90", "for", "cob", "cbl", "ada", "adb", "ads",
    "d", "di", "ps", "eps", "sty", "cls", "bst", "md5", "sha1",
    "sha256", "sha512", "cue", "nfo", "lrc", "m3u", "m3u8", "pls", "xpm",
    "pbm", "pgm", "ppm",
]

# Extensões tratadas como já compactadas (compression_compressed_level).
compression_compressed_extensions = [
    "jpg", "jpeg", "jpe", "jfif", "png", "apng", "gif", "webp", "avif",
    "heic", "heif", "jxl", "jp2", "j2k", "mp4", "m4v", "mov", "mkv",
    "webm", "avi", "wmv", "flv", "f4v", "mpg", "mpeg", "m2ts", "mts",
    "3gp", "3g2", "ogv", "vob", "mp3", "aac", "m4a", "m4b", "ogg",
    "oga", "opus", "wma", "flac", "amr", "mka", "ape", "wv", "zip",
    "zipx", "7z", "rar", "gz", "tgz", "bz2", "tbz2", "tbz", "xz",
    "txz", "zst", "tzst", "lz", "lz4", "lzma", "z", "cab", "arj",
    "lzh", "lha", "ace", "br", "jar", "war", "ear", "apk", "aab",
    "ipa", "xpi", "crx", "whl", "egg", "nupkg", "vsix", "deb", "rpm",
    "snap", "appimage", "dmg", "docx", "xlsx", "pptx", "docm", "xlsm", "pptm",
    "odt", "ods", "odp", "odg", "odf", "epub", "pages", "numbers", "key",
    "kmz", "vsdx", "pdf", "woff", "woff2", "gpg", "pgp", "age", "kdbx",
    "kdb", "aes", "enc",
]

# Um arquivo cujo tamanho alcança essa porcentagem de max_megabytes recebe um arquivo de lote só dele; os
# menores são agrupados.
individual_batch_percent = 100

# Falha final no Cronitor quando um lote passa dessa porcentagem de max_megabytes. 0 desativa, não
# interrompe o job, e lotes de um único arquivo nunca disparam o alerta.
batch_size_alert_percent = 200

# Confere a capacidade livre do disco de origem antes de executar. Use false em origens que informam
# capacidade zero (como Seafile/FUSE). Só essa checagem de capacidade é pulada; as de armazenamento
# temporário e de montagem/caminho continuam.
check_source_disk = true

# Confere a capacidade livre de um destino local (também vale para a pasta de restauração). O S3 não tem
# disco de destino local.
check_destination_disk = true

# Quando este job falha: true continua com os próximos jobs; false interrompe a invocação.
continue_on_job_error = true

# Arquivo com padrões nativos de exclusão do rclone, relativo a este TOML. É lido quando o job começa, e um
# arquivo ausente ou ilegível interrompe o job.
exclude_files = "./excludes.example.txt"

# Ponto de montagem esperado da origem: o volume precisa estar montado e não vazio, senão o job é
# interrompido.
# source_mount = "/mnt/dados"

# Tamanho alvo de cada lote, em MB de dados originais (1 MB = 1.048.576 bytes). Grupos existentes podem
# crescer além disso.
max_megabytes = 1024

# Executável do 7-Zip: 7z, 7zz ou qualquer programa que implemente a linha de comando do 7-Zip.
compressor = "7z"

# Formato dos arquivos de lote: 7z ou zip.
archive_format = "7z"

# Classe de armazenamento S3 dos arquivos de lote.
# Padrão frio: GLACIER_IR, acesso imediato, cobrança de recuperação, mínimo de 90 dias
# de duração faturada e tamanho mínimo faturado de 128 KiB por objeto.
# GLACIER: armazenamento mais barato, restore assíncrono, mínimo de 90 dias.
# DEEP_ARCHIVE: menor preço de arquivo frio, horas para restaurar, mínimo de 180 dias.
# STANDARD: acesso imediato, maior preço de armazenamento, sem prazo mínimo de arquivo frio.
# STANDARD_IA/ONEZONE_IA: recuperação cobrada, mínimo de 30 dias; ONEZONE usa uma zona.
# INTELLIGENT_TIERING: camadas automáticas, taxa de monitoramento (consulte a AWS).
# Controles e arquivo de recuperação do índice sempre usam STANDARD.
# Retenção de 2/10 dias pode gerar cobrança por exclusão antecipada em classes frias.
# Não há preços fixos: custo depende de região, volume e operações de API.
# Veja https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
storage_class = "GLACIER_IR"

# Classe de armazenamento S3 dos JSONs de controle e índices (precisam de acesso imediato, então não GLACIER
# nem DEEP_ARCHIVE). A classe dos arquivos continua sendo storage_class.
control_storage_class = "STANDARD"

# S3: --s3-chunk-size dos envios (por exemplo 64M), útil para arquivos de vários GB. Ignorado em destinos
# locais.
# s3_chunk_size = "64M"

# S3: --s3-upload-concurrency, partes enviadas em paralelo (1-64). Ignorado em destinos locais.
# s3_upload_concurrency = 8

# Jobs batch: bloqueia a execução quando mais dessa porcentagem dos arquivos já salvos sumiu da origem, para
# proteger contra montagens que subiram vazias.
max_delete_percent = 50

# Jobs batch: a proteção de max_delete_percent só vale quando pelo menos tantos arquivos já foram salvos.
deletion_min_files = 20
