# Português do Brasil. English: sambinha.example.toml
# Links da origem são ignorados; links conflitantes no destino são substituídos sem alterar os alvos.
# Caminhos são relativos a ESTE arquivo; ~ e variáveis de ambiente funcionam.
[backup]
state_dir = "./state"
log_dir = "./logs"
# Gerações de metadados confirmadas; dados seguem retenção.
metadata_dir = "./metadata" # JSONs locais dos lotes, ao lado de state e logs.
# Manter logs escritos nos últimos 14 dias; 0 desativa a limpeza automática.
# Logs antigos inativos do Sambinha são removidos em execuções sem simulação.
# Níveis independentes: error, summary (padrão) ou detailed.
# summary grava erros, alertas, resumos por job e resultado final.
# detailed inclui eventos de arquivos; não altera o -vv interno do rclone.
# Retenção do histórico de lotes; jobs simples mantêm indefinidamente os arquivos do backup-dir.
# Aviso consultivo do Cronitor acima desta quantidade de exclusões definitivas previstas.
# Não interrompe o backup nem muda prazos; execute diariamente para receber aviso prévio.
# Verificação diária usa JSONs locais e tamanho/data; não consulta o S3.
# 0 desativa a checagem após backup; use 1 para checar diariamente após backups.
# Atividades independentes (selecione um job batch):
# sambinha verify-local-metadata --job documents-s3         # diário; informa needs_update
# sambinha verify-destination-metadata --job documents-s3   # mensal; compara cópias dos JSONs
# sambinha verify-destination-integrity --job documents-s3                # manual; teste de integridade do 7-Zip
# Padrão: tamanho em bytes e data de modificação em nanossegundos, sem ler conteúdo.
# Use "hash" nos inventários do backup; verify-local-metadata diário de lotes compara só tamanho/data.
# As opções de cache/leitura completa abaixo só se aplicam aos hashes no modo hash.
# P1: reutiliza hashes apenas com dispositivo/inode/tamanho/mtime/ctime/permissões iguais.
# P2: listas literais limitadas e transferências concorrentes em um processo rclone.
# P4: cada worker tem temporários, estado de subprocesso e uploads próprios.
rclone = "rclone"
# Indique a configuração do rclone; vazio usa ~/.config/rclone/rclone.conf.
rclone_config = "./rclone.example.conf"
timeout = 3600
# Arquivo dotenv privado opcional; ~ e variáveis herdadas funcionam no caminho.
# Caminhos relativos partem da pasta deste TOML, independentemente da pasta de execução.
# secrets_file = "~/.config/sambinha/secrets.env"
# Variáveis já exportadas no terminal têm prioridade sobre as do arquivo.
# O arquivo é lido como dados, sem execução; ausente/inválido interrompe o programa.
# Defina CRONITOR_URL no arquivo/ambiente; nunca versione a URL com credenciais.
# Sem esta linha, CRONITOR_URL também é lida automaticamente.
# cronitor_url = "${CRONITOR_URL}"

# A mesma origem pode ter tarefas/destinos/estratégias independentes.
[[jobs]]
name = "documents-local"
recovery_index_versions = 3
deleted_days = 10
version_days = 2
log_retention_days = 14
log_file_level = "summary"
log_terminal_level = "summary"
deletion_alert_threshold = 1000
verify_interval_days = 0
verification_mode = "simple"
fingerprint_cache = true
fingerprint_full_scan_days = 7
transfer_workers = 4
batch_workers = 2
dry_run = false
source = "~/Documents"
destination = "~/Backups/documents-simple"
type = "local"
logic = "simple"
compression_level = 3
compression_threads = 2
# Individual a partir deste % do max_megabytes; mantém o lote normal aberto.
individual_batch_percent = 100
# Falha Cronitor só no final; 0 desativa; não interrompe jobs.
batch_size_alert_percent = 200
# Verificações de disco por job (padrão true); false ignora apenas essa checagem.
# Para origens Seafile/FUSE com capacidade zero, use check_source_disk = false.
# Destino inclui a saída de restauração; S3 não tem disco local de destino.
# Temporários de lotes/recuperação e validações de montagem/caminhos continuam ativos.
check_source_disk = true
check_destination_disk = true
# Se ESTE job falhar, true continua os próximos; false interrompe a execução.
continue_on_job_error = true
# Configurações de lotes, se esta tarefa mudar para logic = "batch"
# max_megabytes = 1024
# compressor = "7z"
# archive_format = "7z"
# Configuração S3; não afeta destinos locais.
# storage_class = "GLACIER_IR"
# control_storage_class = "STANDARD"
# Padrões nativos de exclusão do rclone; caminhos são relativos a este TOML.
exclude_files = "./excludes.example.txt"
# Fixe os volumes esperados (montados e não vazios), quando aplicável.
# source_mount = "/mnt/dados"
# destination_mount = "/mnt/backup"
# Limite absoluto de remoções do rclone nesta tarefa; versões antigas vão ao backup-dir.
max_delete = 100
# Compressão única, padrões para lotes criados/recriados.

[[jobs]]
name = "documents-s3"
recovery_index_versions = 3
deleted_days = 10
version_days = 2
log_retention_days = 14
log_file_level = "summary"
log_terminal_level = "summary"
deletion_alert_threshold = 1000
verify_interval_days = 0
verification_mode = "simple"
fingerprint_cache = true
fingerprint_full_scan_days = 7
transfer_workers = 4
batch_workers = 2
dry_run = false
source = "~/Documents"
# aws é o remote de rclone.example.conf; crie o bucket primeiro.
# Prefira prefixos separados: jobs sobrepostos podem substituir dados/controles.
# O nome do bucket deve ser globalmente único.
destination = "aws:YOUR-BUCKET/documents-batches"
type = "s3"
logic = "batch"
compression_level = 3
compression_threads = 2
# Individual a partir deste % do max_megabytes; mantém o lote normal aberto.
individual_batch_percent = 100
# Falha Cronitor só no final; 0 desativa; não interrompe jobs.
batch_size_alert_percent = 200
# Verificações de disco por job (padrão true); false ignora apenas essa checagem.
# Para origens Seafile/FUSE com capacidade zero, use check_source_disk = false.
# Destino inclui a saída de restauração; S3 não tem disco local de destino.
# Temporários de lotes/recuperação e validações de montagem/caminhos continuam ativos.
check_source_disk = true
check_destination_disk = true
# Se ESTE job falhar, true continua os próximos; false interrompe a execução.
continue_on_job_error = true
# Padrões nativos de exclusão, opcionais também nesta tarefa.
exclude_files = "./excludes.example.txt"
# Volume montado esperado na origem, quando aplicável.
# source_mount = "/mnt/dados"
# S3 não tem montagem local de destino; deixe vazio ou omita.
# destination_mount = ""
max_megabytes = 1024 # MB dos dados originais, sem compactação (1 MB = 1.048.576 bytes)
compressor = "7z" # ou 7zz, qualquer executável que implemente a CLI do 7-Zip
archive_format = "7z" # 7z ou zip
# Padrão frio: GLACIER_IR, acesso imediato, cobrança de recuperação, mínimo de 90 dias
# de duração faturada e tamanho mínimo faturado de 128 KiB por objeto.
# GLACIER: armazenamento mais barato, restore assíncrono, mínimo de 90 dias.
# DEEP_ARCHIVE: menor preço de arquivo frio, horas para restaurar, mínimo de 180 dias.
# STANDARD: acesso imediato, maior preço de armazenamento, sem prazo mínimo de arquivo frio.
# STANDARD_IA/ONEZONE_IA: recuperação cobrada, mínimo de 30 dias; ONEZONE usa uma zona.
# INTELLIGENT_TIERING: camadas automáticas, taxa de monitoramento (consulte a AWS).
# Controles e arquivo de recuperação do índice sempre usam STANDARD.
# Retenção de 2/10 dias pode gerar cobrança por exclusão antecipada em classes frias.
# Não há preços fixos: custo depende de região, volume e operações de API.
# Veja https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
storage_class = "GLACIER_IR"
control_storage_class = "STANDARD" # JSONs/índices; arquivos compactados usam storage_class.
max_delete_percent = 50
deletion_min_files = 20
