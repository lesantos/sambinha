# Português do Brasil. English: rclone.example.conf
# Referencie este arquivo em [backup].rclone_config no TOML do aplicativo.
# Este arquivo tem apenas conexão; credenciais ficam fora do Git.
[aws]
type = s3
provider = AWS
region = sa-east-1
env_auth = true
acl = private
# env_auth usa a cadeia de credenciais AWS (ambiente/perfil/role IAM).
# Para um perfil nomeado: export AWS_PROFILE=sambinha
# Em EC2/ECS, atribua uma role IAM com acesso limitado ao prefixo do backup.
# Não versione access_key_id ou secret_access_key aqui.
