name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    # Fast gate: `ruff check` and mypy. `ruff format` is configured but not
    # enforced, so formatting-only differences never fail CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m mypy sambinha
  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Audit all Git history for credentials
        if: matrix.python-version == '3.12'
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          audit_dir=$(mktemp -d)
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$release_url/$archive" -o "$audit_dir/$archive"
          curl -fsSL "$release_url/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o "$audit_dir/checksums.txt"
          python -c 'import hashlib,pathlib,sys; p=pathlib.Path(sys.argv[1]); expected=next(line.split()[0] for line in pathlib.Path(sys.argv[2]).read_text().splitlines() if line.rstrip().endswith(p.name)); assert hashlib.sha256(p.read_bytes()).hexdigest()==expected' "$audit_dir/$archive" "$audit_dir/checksums.txt"
          tar -xzf "$audit_dir/$archive" -C "$audit_dir" gitleaks
          GITLEAKS_BIN="$audit_dir/gitleaks" ./scripts/check-secrets.sh
      - run: sudo apt-get update && sudo apt-get install -y rclone p7zip-full
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -n auto --cov=sambinha --cov-branch --cov-report=term --cov-fail-under=92
        env:
          SAMBINHA_HTTP_S3_TESTS: '1'
  macos:
    # Informative until validated on real hardware: exercises the Darwin code
    # paths (mount table, mount point check, O_PATH fallback) with live tools.
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: brew install rclone sevenzip
      # The runner image ships p7zip 17.x as `7z`, below the 22.00 minimum;
      # expose Homebrew's 7zz under the default compressor name as well.
      - run: |
          mkdir -p "$HOME/bin"
          ln -sf "$(command -v 7zz)" "$HOME/bin/7z"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -n auto -v tests/unit/test_macos.py tests/integration/test_macos.py tests/unit/test_filesystems.py tests/integration/test_filesystems.py tests/unit/test_mounts.py tests/integration/test_mounts.py tests/unit/test_inventory.py tests/integration/test_inventory.py
