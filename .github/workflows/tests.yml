name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y rclone p7zip-full
      - run: python -m pip install -e . -r requirements-test.txt
      - run: python -m coverage run --branch -m unittest discover -v
      - run: python -m coverage report --include='smabafiba/*' --fail-under=85
      - run: python -m unittest tests.test_s3_http -v
        env:
          SMABAFIBA_HTTP_S3_TESTS: '1'
