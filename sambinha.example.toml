# English. Brazilian Portuguese: sambinha.example.pt-BR.toml
# Source links are ignored; conflicting destination links are replaced without touching targets.
# Paths are relative to THIS configuration file; ~ and environment variables work.
[backup]
state_dir = "./state"
log_dir = "./logs"
# Confirmed metadata generations; data follows retention.
metadata_dir = "./metadata" # Local batch JSON mirrors, beside state and logs.
# Keep logs written in the last 14 days; 0 disables automatic cleanup.
# Old inactive Sambinha logs are removed during non-simulated invocations.
# Independent levels: error, summary (default), or detailed.
# summary records errors, alerts, per-job summaries, and the final result.
# detailed includes per-file events; it does not change rclone's internal -vv.
# Batch history retention; simple jobs keep rclone backup-dir files indefinitely.
# Soft Cronitor alert for more than this many impending permanent deletions.
# Does not stop backups or change deadlines; run daily for advance notice.
# Daily source verification uses only local JSONs and size/time; no S3 reads.
# 0 disables the check after backup; set 1 to check once per day after backups.
# Independent activities (select a batch job):
# sambinha verify-local-metadata --job documents-s3         # daily; reports needs_update
# sambinha verify-destination-metadata --job documents-s3   # monthly; compare JSON replicas
# sambinha verify-destination-integrity --job documents-s3                # manual; 7-Zip integrity test
# Default: compare size in bytes and nanosecond modification time without reading contents.
# Use "hash" for backup inventories; daily batch verify-local-metadata still compares only size/time.
# P1: in hash mode, reuse hashes only when device/inode/size/mtime/ctime/mode all match.
# These options never enable content hashing in simple mode.
# P2: bounded raw file lists and concurrent transfers in one rclone process.
# P4: each worker has separate staging, subprocess state and uploads.
rclone = "rclone"
# Point to a rclone configuration; empty uses ~/.config/rclone/rclone.conf.
rclone_config = "./rclone.example.conf"
timeout = 3600
# Optional private dotenv file; ~ and inherited variables work in its path.
# Relative paths start at the directory of this TOML, not the working directory.
# secrets_file = "~/.config/sambinha/secrets.env"
# Already-exported terminal variables take precedence over file values.
# The file is read as data, not executed; a missing/invalid file stops execution.
# Set CRONITOR_URL in the file/environment; never commit the credential-bearing URL.
# With this line omitted, CRONITOR_URL is also read automatically.
# cronitor_url = "${CRONITOR_URL}"

# The same source may have multiple independent jobs/destinations/strategies.
[[jobs]]
name = "documents-local"
recovery_index_versions = 3
deleted_days = 10
version_days = 2
log_retention_days = 14
log_file_level = "summary"
log_terminal_level = "summary"
deletion_alert_threshold = 1000
verify_interval_days = 0
verification_mode = "simple"
fingerprint_cache = true
fingerprint_full_scan_days = 7
transfer_workers = 4
batch_workers = 2
dry_run = false
source = "~/Documents"
destination = "~/Backups/documents-simple"
type = "local"
logic = "simple"
compression_level = 3
compression_threads = 2
# Dedicated archive at this % of max_megabytes; keep normal batch open.
individual_batch_percent = 100
# Final Cronitor failure only; 0 disables; does not interrupt jobs.
batch_size_alert_percent = 200
# Per-job disk checks (default true); false skips only that capacity check.
# For Seafile/FUSE sources reporting zero capacity, set check_source_disk = false.
# Destination also covers restore output; S3 has no local destination disk.
# Batch/recovery temporary storage and mount/path checks remain enabled.
check_source_disk = true
check_destination_disk = true
# When THIS job fails, true continues the next jobs; false stops the invocation.
continue_on_job_error = true
# Batch settings, if this job is changed to logic = "batch"
# max_megabytes = 1024
# compressor = "7z"
# archive_format = "7z"
# S3 setting; does not affect a local destination.
# storage_class = "GLACIER_IR"
# control_storage_class = "STANDARD"
# Native rclone exclusion patterns; paths are relative to this TOML.
exclude_files = "./excludes.example.txt"
# Pin expected mounted volumes (must be mounted and nonempty), if applicable.
# source_mount = "/mnt/dados"
# destination_mount = "/mnt/backup"
# Absolute rclone deletion limit for this job; old versions go to backup-dir.
max_delete = 100
# Uniform compression, defaults for newly created/rebuilt archives.

[[jobs]]
name = "documents-s3"
recovery_index_versions = 3
deleted_days = 10
version_days = 2
log_retention_days = 14
log_file_level = "summary"
log_terminal_level = "summary"
deletion_alert_threshold = 1000
verify_interval_days = 0
verification_mode = "simple"
fingerprint_cache = true
fingerprint_full_scan_days = 7
transfer_workers = 4
batch_workers = 2
dry_run = false
source = "~/Documents"
# aws is the remote in rclone.example.conf; create the bucket first.
# Prefer separate prefixes: overlapping jobs can overwrite data/recovery controls.
# Bucket name must be globally unique.
destination = "aws:YOUR-BUCKET/documents-batches"
type = "s3"
logic = "batch"
compression_level = 3
compression_threads = 2
# Dedicated archive at this % of max_megabytes; keep normal batch open.
individual_batch_percent = 100
# Final Cronitor failure only; 0 disables; does not interrupt jobs.
batch_size_alert_percent = 200
# Per-job disk checks (default true); false skips only that capacity check.
# For Seafile/FUSE sources reporting zero capacity, set check_source_disk = false.
# Destination also covers restore output; S3 has no local destination disk.
# Batch/recovery temporary storage and mount/path checks remain enabled.
check_source_disk = true
check_destination_disk = true
# When THIS job fails, true continues the next jobs; false stops the invocation.
continue_on_job_error = true
# Native exclusion patterns, optional for this job too.
exclude_files = "./excludes.example.txt"
# Expected mounted source volume, if applicable.
# source_mount = "/mnt/dados"
# There is no local mount for an S3 destination; keep this empty or omitted.
# destination_mount = ""
max_megabytes = 1024 # MB of original data (1 MB = 1,048,576 bytes); existing groups may grow
compressor = "7z" # or 7zz, any executable implementing the 7-Zip CLI
archive_format = "7z" # 7z or zip
# Cold default: GLACIER_IR, immediate retrieval, retrieval fees, 90-day minimum
# billed duration and 128 KiB minimum billed object size.
# GLACIER: cheaper storage, asynchronous restore, 90-day minimum.
# DEEP_ARCHIVE: lowest archive storage rates, hours to restore, 180-day minimum.
# STANDARD: immediate access, higher storage rates, no archive minimum duration.
# STANDARD_IA/ONEZONE_IA: retrieval fees, 30-day minimum; ONEZONE uses one AZ.
# INTELLIGENT_TIERING: automatic tiers, monitoring fee (check AWS pricing).
# Controls and the control recovery archive always use STANDARD.
# 2/10-day retention can incur early-deletion charges in archival classes.
# No prices are hardcoded: cost depends on region, volume and API operations.
# See https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
storage_class = "GLACIER_IR"
control_storage_class = "STANDARD" # JSON controls and indexes; archive class remains storage_class.
max_delete_percent = 50
deletion_min_files = 20
