# Reference this file via [backup].rclone_config in the application's TOML.
# This file contains connection settings only; credentials stay outside Git.
[aws]
type = s3
provider = AWS
region = sa-east-1
env_auth = true
acl = private
# env_auth uses the AWS credential chain (environment/profile/IAM role).
# For a named profile: export AWS_PROFILE=sambinha
# For EC2/ECS, assign an IAM role with access limited to the backup prefix.
# No access_key_id or secret_access_key should be committed here.
